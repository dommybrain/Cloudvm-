name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mybuilder .

      - name: Build APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            mybuilder \
            bash -c "
              pip3 install legacy-cgi 2>/dev/null || true && \
              find / -name '_tempita.py' 2>/dev/null | \
              xargs sed -i 's/^import cgi/try:\n    import cgi\nexcept ImportError:\n    import html as cgi/' 2>/dev/null || true && \
              cd /app && yes | buildozer android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
          if-no-files-found: warn
