name: Buildozer APK Stable Fix

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system deps
      run: |
        apt update
        apt install -y git zip unzip wget openjdk-17-jdk

    - name: Setup Android SDK (AIDL FIX)
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME

        cd $HOME
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
        unzip cmd.zip -d cmdtools

        mkdir -p $ANDROID_HOME/cmdline-tools
        mv cmdtools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --sdk_root=$ANDROID_HOME \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Accept licenses
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses

    - name: Build APK (NO ROOT PROMPT FIX)
      run: |
        export PIP_ROOT_USER_ACTION=ignore
        export BUILDDOZER_WARN_ON_ROOT=0
        export DEBIAN_FRONTEND=noninteractive

        python - << 'EOF'
import subprocess, os

os.environ["PIP_ROOT_USER_ACTION"] = "ignore"
os.environ["BUILDDOZER_WARN_ON_ROOT"] = "0"
os.environ["DEBIAN_FRONTEND"] = "noninteractive"

subprocess.run(
    ["buildozer", "android", "debug", "--verbose"],
    input=b"y\n",
)
EOF
