name: Buildozer APK (FIXED)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        apt update
        apt install -y wget unzip git openjdk-17-jdk

    - name: Setup Android SDK (FIXED PATH)
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME

        cd $HOME

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
        unzip cmd.zip -d cmdline-tools-temp

        mkdir -p $ANDROID_HOME/cmdline-tools
        mv cmdline-tools-temp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --sdk_root=$ANDROID_HOME \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Accept licenses (FIXED)
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses

    - name: Build APK
      run: |
        buildozer android debug
