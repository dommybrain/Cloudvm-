name: Build APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python version
        run: |
          which python
          python --version
          which pip
          pip --version

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev \
            lld

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean old Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle/caches

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      - name: Install Buildozer and python-for-android
        run: |
          pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv

          pip install \
            https://github.com/kivy/python-for-android/archive/refs/heads/master.zip

      - name: Verify installed versions
        run: |
          python --version

          pip show buildozer
          pip show cython
          pip show python-for-android

      - name: Build APK
        env:
          PYTHONNOUSERSITE: 1
        run: |
          buildozer android clean
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
          if-no-files-found: warn
