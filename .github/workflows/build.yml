name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf automake libtool \
            pkg-config \
            cmake \
            build-essential \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev libncursesw5-dev

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip setuptools wheel cython virtualenv

      - name: Install Buildozer + Python tools
        run: |
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21
          pip install appdirs

      - name: Clean build environment
        run: |
          rm -rf .buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foxyscanner-apk
          path: bin/*.apk
