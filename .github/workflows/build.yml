name: Build APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python version
        run: |
          which python
          python --version
          which pip
          pip --version

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev \
            lld

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean old caches
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle/caches

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      - name: Install Buildozer stack
        run: |
          pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv

      - name: Clone python-for-android manually
        run: |
          mkdir -p .buildozer/android/platform

          git clone \
            https://github.com/kivy/python-for-android.git \
            .buildozer/android/platform/python-for-android

      - name: Generate debug keystore automatically
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure buildozer signing
        run: |
          echo "" >> buildozer.spec
          echo "android.release_artifact = apk" >> buildozer.spec
          echo "android.debug = 1" >> buildozer.spec
          echo "android.release_keystore = debug.keystore" >> buildozer.spec
          echo "android.release_keyalias = androiddebugkey" >> buildozer.spec
          echo "android.release_keystore_passwd = android" >> buildozer.spec
          echo "android.release_keyalias_passwd = android" >> buildozer.spec

      - name: Verify installations
        run: |
          python --version

          pip show buildozer
          pip show cython

          ls -la .buildozer/android/platform/
          ls -la .buildozer/android/platform/python-for-android

      - name: Build APK
        env:
          PYTHONNOUSERSITE: 1
        run: |
          buildozer android clean
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
