name: Buildozer APK Stable

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        apt update
        apt install -y git zip unzip wget openjdk-17-jdk

    - name: Setup Android SDK (FIX AIDL)
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME

        cd $HOME
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
        unzip cmd.zip -d cmdtools

        mkdir -p $ANDROID_HOME/cmdline-tools
        mv cmdtools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --sdk_root=$ANDROID_HOME \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Accept licenses
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses

    - name: Build APK (NO ROOT PROMPT FIX)
      run: |
        export BUILDDOZER_WARN_ON_ROOT=0
        export PIP_ROOT_USER_ACTION=ignore

        buildozer android debug --verbose --allow-root
