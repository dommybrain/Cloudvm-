name: Build Signed APK (PRO)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean build
        run: |
          rm -rf .buildozer bin

      - name: Build APK (release optimized)
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foxyscanner-apk
          path: bin/*.apk
