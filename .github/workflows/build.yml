name: Buildozer APK (Docker Stable)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Fix system packages
      run: |
        apt update
        apt install -y git zip unzip openjdk-17-jdk wget

    - name: Clean buildozer cache
      run: |
        buildozer android clean || true
        rm -rf .buildozer

    - name: Install Android SDK components (FIX AIDL)
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$ANDROIDSDK/cmdline-tools/latest/bin:$PATH

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
        unzip cmd.zip -d sdk

        mkdir -p $ANDROIDSDK/cmdline-tools
        mv sdk/cmdline-tools $ANDROIDSDK/cmdline-tools/latest

        yes | $ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Accept licenses
      run: |
        yes | $ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Build APK
      run: |
        buildozer -v android debug
