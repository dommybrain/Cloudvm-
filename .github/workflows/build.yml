name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mybuilder .

      - name: Build APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            mybuilder \
            bash -c "
              cd /app && \
              pip3 install legacy-cgi 2>/dev/null || true && \
              yes | buildozer android debug 2>&1
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
          if-no-files-found: warn
